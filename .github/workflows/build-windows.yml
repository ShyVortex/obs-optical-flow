name: Build (Windows)

# Manual only: started by release.yml, or on its own from the Actions tab
# to re-run just this platform. Never triggered by pushes.
on:
  workflow_call:
    inputs:
      obs-version:
        description: OBS Studio release to build against
        type: string
        default: "32.1.2"
  workflow_dispatch:
    inputs:
      obs-version:
        description: OBS Studio release to build against
        type: string
        default: "32.1.2"

permissions:
  contents: read

env:
  OBS_VERSION: ${{ inputs.obs-version }} # obs.dll to generate the import library from

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project version
        id: version
        run: echo "version=$(.github/scripts/project-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Download OBS Studio ${{ env.OBS_VERSION }} (portable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OBS_VERSION" -R obsproject/obs-studio \
            -p "OBS-Studio-$OBS_VERSION-Windows-x64.zip" -D "$RUNNER_TEMP"
          7z x -y -o"$RUNNER_TEMP/obs" "$RUNNER_TEMP/OBS-Studio-$OBS_VERSION-Windows-x64.zip" > /dev/null
          test -f "$RUNNER_TEMP/obs/bin/64bit/obs.dll"

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTS=ON -DOBS_DIR="$RUNNER_TEMP/obs"

      - name: Build
        run: cmake --build build --config Release --parallel

      # Hosted runners have no GPU; D3D11 falls back to WARP (software).
      # Best effort until proven reliable; does not fail the build.
      - name: Test (D3D11 / WARP)
        continue-on-error: true
        timeout-minutes: 10
        run: ctest --test-dir build --timeout 120 -C Release --output-on-failure -R d3d11

      - name: Package
        id: package
        run: |
          V="${{ steps.version.outputs.version }}"
          cmake --install build --config Release --prefix stage
          cmake --install build --config Release --component tests --prefix stage-tests
          cp test/run-tests.ps1 stage-tests/
          PKG="obs-optical-flow-$V-windows-x64.zip"
          (cd stage && 7z a -tzip "../$PKG" obs-optical-flow > /dev/null)
          echo "package=$PKG" >> "$GITHUB_OUTPUT"

      - name: Upload plugin package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.package }}
          archive: false
          if-no-files-found: error

      - name: Upload test harnesses
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-windows-x64
          path: stage-tests/
          if-no-files-found: error
