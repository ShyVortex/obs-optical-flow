name: Build (Linux)

# Manual only: started by release.yml, or on its own from the Actions tab
# to re-run just this platform. Never triggered by pushes.
on:
  workflow_call:
    inputs:
      obs-version:
        description: OBS Studio release to build against
        type: string
        default: "32.1.2"
  workflow_dispatch:
    inputs:
      obs-version:
        description: OBS Studio release to build against
        type: string
        default: "32.1.2"

permissions:
  contents: read

env:
  OBS_VERSION: ${{ inputs.obs-version }} # libobs to link against; matches deps/libobs-headers

jobs:
  build:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project version
        id: version
        run: echo "version=$(.github/scripts/project-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install OBS Studio ${{ env.OBS_VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$OBS_VERSION" -R obsproject/obs-studio \
            -p "OBS-Studio-$OBS_VERSION-Ubuntu-24.04-x86_64.deb" -D "$RUNNER_TEMP"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$RUNNER_TEMP/OBS-Studio-$OBS_VERSION-Ubuntu-24.04-x86_64.deb" \
            xvfb xauth libgl1-mesa-dri libegl1 libx11-6

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      # Software rendering (Mesa llvmpipe) on a virtual X server. Best effort
      # until proven reliable on hosted runners; does not fail the build.
      - name: Test (OpenGL / llvmpipe)
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Package
        id: package
        run: |
          V="${{ steps.version.outputs.version }}"
          cmake --install build --prefix stage
          cmake --install build --component tests --prefix stage-tests
          cp test/run-tests.sh stage-tests/
          PKG="obs-optical-flow-$V-linux-x86_64.tar.gz"
          tar -C stage -czf "$PKG" obs-optical-flow
          echo "package=$PKG" >> "$GITHUB_OUTPUT"

      - name: Upload plugin package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.package }}
          archive: false
          if-no-files-found: error

      - name: Upload test harnesses
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-linux-x86_64
          path: stage-tests/
          if-no-files-found: error
