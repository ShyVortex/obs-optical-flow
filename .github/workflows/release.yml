name: Release

# The orchestrator. Manual only (Actions tab -> Release -> Run workflow, or
# `gh workflow run release.yml --ref <branch> -f publish=false`); no
# workflow in this repository runs on push, pull request or schedule.
#
#   publish = false  build Linux, Windows and macOS; packages stay on the
#                    run page as artifacts (90-day retention), plus a
#                    release-preview artifact (notes + checksums) that
#                    rehearses everything a release would publish
#   publish = true   additionally create the GitHub release v<version>
#                    (version from CMakeLists.txt) with the packages,
#                    SHA256SUMS.txt and notes built from
#                    .github/release-template.md + the CHANGELOG.md section
#   draft   = true   (with publish) create the release as a draft, so it can
#                    be reviewed and published from the Releases page

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release (otherwise only build artifacts)
        type: boolean
        default: false
      draft:
        description: Create the release as a draft (only with publish)
        type: boolean
        default: true

# One release run at a time; a second one waits instead of racing for the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  OBS_VERSION: "32.1.2" # OBS Studio release every platform builds against

jobs:
  # Validate everything a release needs *before* spending runner time.
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      obs-version: ${{ steps.version.outputs.obs-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read project version
        id: version
        run: |
          V=$(.github/scripts/project-version.sh)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "obs-version=$OBS_VERSION" >> "$GITHUB_OUTPUT"
          echo "### obs-optical-flow $V (publish: ${{ inputs.publish }}, draft: ${{ inputs.draft }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Check release preconditions
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases can only be published from main (this run is on $GITHUB_REF). Re-run with publish=false, or merge first."
            exit 1
          fi
          if gh release view "v$V" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "::error::Release/tag v$V already exists. Bump the version in CMakeLists.txt."
            exit 1
          fi
          python3 .github/scripts/release-notes.py --version "$V" --check

  linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      obs-version: ${{ needs.prepare.outputs.obs-version }}

  windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      obs-version: ${{ needs.prepare.outputs.obs-version }}

  macos:
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      obs-version: ${{ needs.prepare.outputs.obs-version }}

  # Runs on every invocation, so each publish=false run also rehearses the
  # release: packages downloaded, checksummed, notes rendered (shown in the
  # run summary and uploaded as the release-preview artifact). Read-only.
  assemble:
    name: Assemble release
    needs: [prepare, linux, windows, macos]
    runs-on: ubuntu-24.04
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for the "compare with previous release" link

      - name: Download plugin packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: obs-optical-flow-*
          path: release/dist
          merge-multiple: true

      - name: Verify packages and write checksums
        working-directory: release/dist
        run: |
          ls -l
          for f in "obs-optical-flow-$V-windows-x64.zip" "obs-optical-flow-$V-macos-arm64.zip"; do
            unzip -tq "$f" || { echo "::error::$f is not a valid zip"; exit 1; }
          done
          tar -tzf "obs-optical-flow-$V-linux-x86_64.tar.gz" > /dev/null \
            || { echo "::error::linux package is not a valid tar.gz"; exit 1; }
          test "$(ls | wc -l)" -eq 3 || { echo "::error::expected exactly 3 packages"; exit 1; }
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -vx "v$V" | head -n1 || true)
          # a dry run (publish=false) may preview an undated changelog entry
          python3 .github/scripts/release-notes.py --version "$V" \
            --repo "$GITHUB_REPOSITORY" --previous-tag "$PREV" \
            --obs-version "${{ needs.prepare.outputs.obs-version }}" \
            ${{ !inputs.publish && '--allow-undated' || '' }} > release/notes.md
          cat release/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview
          path: |
            release/notes.md
            release/dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, assemble]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the tag and the release; nothing else
    env:
      V: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download plugin packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: obs-optical-flow-*
          path: dist
          merge-multiple: true

      - name: Download release preview
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-preview
          path: preview

      - name: Create release v${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$V" dist/* preview/dist/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "obs-optical-flow $V" \
            --notes-file preview/notes.md \
            ${{ inputs.draft && '--draft' || '' }}
